name: Snip CI

# When should GitHub run these checks?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# The workflow needs permission to read the repository.
permissions:
  contents: read

jobs:
  quality-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Download our repository into GitHub's temporary machine.
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install uv and Python.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # 3. Install dependencies from uv.lock.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # 4. Check Python code for linting issues.
      - name: Run Ruff
        run: uv run ruff check .

      # 5. Enforce our modular architecture rules.
      - name: Run import-linter
        run: uv run lint-imports

      # 6. Run automated tests.
      - name: Run tests
        run: uv run python -m pytest
