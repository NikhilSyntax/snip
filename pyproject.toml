
[project]
name = "snip"
version = "0.1.0"
description = "A simple URL shortener backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "scalar-fastapi>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
# Python version used by this project
target-version = "py312"

# Maximum characters per line
line-length = 88

[tool.ruff.lint]
# Rules Ruff should enforce
select = [
    "E",    # pycodestyle: common Python style errors
    "F",    # Pyflakes: unused imports, undefined variables, etc.
    "I",    # isort: organize imports
    "B",    # flake8-bugbear: catches common mistakes
    "UP",   # pyupgrade: modern Python syntax
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indentation using 4 spaces
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]